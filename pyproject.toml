[project]
name = "channel-publisher-bot"
version = "0.1.1"
description = "Telegram bot and Mini App for scheduling channel publications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
