services:
  bot:
    build:
      context: .
    command:
      - uv
      - run
      - python
      - -m
      - app.main
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data

  web:
    build:
      context: .
    command:
      - uv
      - run
      - uvicorn
      - app.web:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
              "http://127.0.0.1:8080/health",
              timeout=3
          ).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
