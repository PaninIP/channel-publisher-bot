name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check app tests

      - name: Run Ruff
        run: uv run ruff check app tests

      - name: Compile Python sources
        run: uv run python -m compileall app tests

      - name: Run tests
        run: uv run python -m pytest

      - name: Check JavaScript syntax
        run: |
          node --check webapp/app.js
          node --check webapp/content-plan.js
          node --check webapp/rich-editor.js

      - name: Check deployment scripts
        run: |
          bash -n deploy/deploy.sh
          bash -n deploy/rollback.sh

      - name: Build Docker image
        run: docker build --tag channel-publisher-bot:ci .
